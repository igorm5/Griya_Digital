spring.application.name=rusunawa-griya
server.port=8080

# ==============================================================================
# Supabase PostgreSQL Database Configuration
# ==============================================================================
# Catatan:
# Anda dapat mengisi langsung nilainya di bawah ini, atau melalui Environment Variable.
# Cek di Supabase: Project Settings -> Database -> Connection String (Pilih tab JDBC / URI)
# ==============================================================================

spring.datasource.driver-class-name=org.postgresql.Driver

# URL JDBC Supabase (Direct Port 5432 atau Pooler Port 6543)
# Contoh: jdbc:postgresql://db.xyzabcdefghijklm.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require}

# Username default: postgres (atau postgres.YOUR_PROJECT_REF jika menggunakan pooler)
spring.datasource.username=${DB_USERNAME:postgres}

# Password database Supabase yang Anda atur
spring.datasource.password=${DB_PASSWORD:YOUR_DATABASE_PASSWORD}

# ==============================================================================
# JPA / Hibernate Configuration for PostgreSQL
# ==============================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 'update': Hibernate akan membuat/menyesuaikan tabel otomatis jika belum ada di Supabase
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
