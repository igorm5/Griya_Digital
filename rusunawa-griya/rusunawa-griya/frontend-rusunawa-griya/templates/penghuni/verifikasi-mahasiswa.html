<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Mahasiswa - Rusunawa & Griya UB</title>
  <link rel="stylesheet" href="../../static/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <a href="katalog.html" class="brand">
        <span class="brand-logo">R</span>
        <span>Rusunawa & Griya UB</span>
      </a>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="katalog.html" class="nav-link">Katalog</a>
          <a href="pesanan-saya.html" class="nav-link">Pesanan Saya</a>
          <a href="profil.html" class="nav-link active">Profil</a>
        </nav>
        <a href="profil.html" class="avatar-circle">AR</a>
      </div>
    </div>
  </header>

  <main class="container-narrow">
    <a href="profil.html" class="back-link">&larr; Verifikasi Mahasiswa</a>

    <form action="profil.html" class="card" style="padding: 28px;">
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 18px;">
        Lengkapi data berikut. Pengelola akan memeriksa dokumen sebelum akses asrama dibuka.
      </p>

      <div class="form-group">
        <label class="form-label">Asal perguruan tinggi</label>
        <select class="form-control">
          <option selected>Universitas Brawijaya</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Fakultas</label>
        <select class="form-control" required>
          <option value="" disabled selected>Pilih fakultas</option>
          <option>Fakultas Ilmu Komputer (FILKOM)</option>
          <option>Fakultas Teknik (FT)</option>
          <option>Fakultas Ekonomi dan Bisnis (FEB)</option>
          <option>Fakultas Kedokteran (FK)</option>
          <option>Fakultas Ilmu Administrasi (FIA)</option>
          <option>Fakultas Hukum (FH)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">NIM</label>
        <input type="text" class="form-control" placeholder="Nomor induk mahasiswa" required>
      </div>

      <div class="form-group">
        <label class="form-label">Dokumen pendukung</label>
        <label class="upload-dropzone">
          <div style="font-size: 18px; color: var(--text-muted); margin-bottom: 6px;">&uarr;</div>
          <div id="ktm-filename" style="font-weight: 600; font-size: 13px; color: var(--text-main);">Unggah KTM atau surat keterangan aktif</div>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">JPG, PNG, atau PDF · maks. 5 MB</div>
          <input type="file" accept=".jpg,.jpeg,.png,.pdf" style="display: none;" onchange="if(this.files[0]) document.getElementById('ktm-filename').textContent = this.files[0].name;">
        </label>
      </div>

      <div class="info-banner">
        Status pengajuan tampil di Profil. Setelah disetujui, Anda menjadi Mahasiswa.
      </div>

      <button type="submit" class="btn btn-primary btn-block">Kirim Pengajuan</button>
    </form>
  </main>
</body>
</html>
