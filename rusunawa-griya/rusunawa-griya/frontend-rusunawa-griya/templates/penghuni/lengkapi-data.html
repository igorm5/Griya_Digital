<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lengkapi Data Diri - Rusunawa & Griya UB</title>
  <link rel="stylesheet" href="../../static/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <a href="katalog.html" class="brand">
        <span class="brand-logo">R</span>
        <span>Rusunawa & Griya UB</span>
      </a>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="katalog.html" class="nav-link">Katalog</a>
          <a href="pesanan-saya.html" class="nav-link">Pesanan Saya</a>
          <a href="profil.html" class="nav-link active">Profil</a>
        </nav>
        <a href="profil.html" class="avatar-circle">AR</a>
      </div>
    </div>
  </header>

  <main class="container-narrow">
    <form action="profil.html" class="card" style="padding: 28px;">
      <h1 style="font-size: 18px; font-weight: 700;">Lengkapi data diri</h1>
      <p style="font-size: 12px; color: var(--text-muted); margin: 4px 0 20px;">Dibutuhkan pengelola untuk memverifikasi pemesanan.</p>

      <div class="form-section-title">Terkunci dari SSO UB</div>
      <div class="grid-2-col">
        <div class="form-group">
          <label class="form-label">Nama</label>
          <div class="input-with-meta">
            <input type="text" class="form-control locked" value="Aulia Rahmawati" readonly>
            <span class="input-meta-right">&#128274;</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">NIM</label>
          <div class="input-with-meta">
            <input type="text" class="form-control locked" value="255150200111051" readonly>
            <span class="input-meta-right">&#128274;</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Fakultas</label>
          <div class="input-with-meta">
            <input type="text" class="form-control locked" value="FILKOM" readonly>
            <span class="input-meta-right">&#128274;</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-with-meta">
            <input type="email" class="form-control locked" value="aulia@student.ub.ac.id" readonly>
            <span class="input-meta-right">&#128274;</span>
          </div>
        </div>
      </div>

      <div class="form-section-title" style="margin-top: 10px;">Unggah Data</div>
      <div class="form-group">
        <label class="form-label">NIK KTP (16 digit)</label>
        <div class="input-with-meta">
          <input type="text" maxlength="16" class="form-control" placeholder="16 digit sesuai KTP" oninput="document.getElementById('nik-len').textContent = this.value.length + '/16'">
          <span class="input-meta-right" id="nik-len">0/16</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">No. telepon / WhatsApp</label>
        <input type="tel" class="form-control" placeholder="Nomor aktif">
      </div>

      <div class="info-banner">
        NIK dan nomor telepon hanya dilihat pengelola untuk verifikasi.
      </div>

      <button type="submit" class="btn btn-primary btn-block">Simpan & Lanjut</button>
    </form>
  </main>
</body>
</html>
